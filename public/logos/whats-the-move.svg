  <line x1="40" y1="48" x2="40" y2="54" stroke="#7c5cd8" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="24" y2="32" stroke="#7c5cd8" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="32" x2="62" y2="32" stroke="#7c5cd8" stroke-width="3" stroke-linecap="round"/>
</svg>
