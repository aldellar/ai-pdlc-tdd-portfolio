<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 40" role="img" aria-label="IBM">
  <!-- IBM 8-bar logo simplified -->
  <g fill="#0f62fe">
    <!-- I -->
    <rect x="0"  y="4"  width="16" height="3"/>
    <rect x="0"  y="11" width="16" height="3"/>
    <rect x="5"  y="18" width="6"  height="3"/>
    <rect x="5"  y="25" width="6"  height="3"/>
    <rect x="0"  y="32" width="16" height="3"/>
    <rect x="0"  y="32" width="16" height="3"/>
    <!-- I bar gaps already handled by spacing -->

    <!-- B -->
    <rect x="21" y="4"  width="16" height="3"/>
    <rect x="21" y="11" width="18" height="3"/>
    <rect x="21" y="18" width="16" height="3"/>
    <rect x="21" y="25" width="18" height="3"/>
    <rect x="21" y="32" width="16" height="3"/>

    <!-- M -->
    <rect x="42" y="4"  width="16" height="3"/>
    <rect x="42" y="11" width="7"  height="3"/>
    <rect x="51" y="11" width="7"  height="3"/>
    <rect x="42" y="18" width="16" height="3"/>
    <rect x="42" y="25" width="16" height="3"/>
    <rect x="42" y="32" width="16" height="3"/>
  </g>
</svg>
